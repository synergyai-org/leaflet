<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SYNERGY A.I.</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script>
      // Suppress CDN warning for development
      if (typeof tailwind !== "undefined") {
        tailwind.config = { corePlugins: { preflight: true } };
      }
    </script>
    <!-- Fonts -->
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,700;1,400&family=Merriweather:ital,wght@0,300;0,700;1,300&family=Montserrat:wght@300;400;700&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Roboto:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
      :root {
        --matte-black: #0a0a0a;
        --dark-gold: #b0925a;
        --light-gold: #e1b16a;
        --border-color: rgba(176, 146, 90, 0.2);
        --glow-color: rgba(176, 146, 90, 0.15);
      }

      body {
        background-color: var(--matte-black);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      @keyframes shine {
        to {
          background-position: 200% center;
        }
      }

      /* 강조 색상 변수와 연동된 애니메이션 */
      @keyframes borderPulse {
        0% {
          box-shadow: 0 0 10px var(--glow-color);
          border-color: var(--border-color);
        }
        50% {
          box-shadow: 0 0 25px var(--glow-color);
          border-color: var(--dark-gold);
        }
        100% {
          box-shadow: 0 0 10px var(--glow-color);
          border-color: var(--border-color);
        }
      }

      .hero-title-gradient {
        /* 타이틀 그래디언트에도 강조 색상 적용 */
        background: linear-gradient(
          135deg,
          var(--dark-gold) 20%,
          var(--light-gold) 40%,
          #ffffff 50%,
          var(--light-gold) 60%,
          var(--dark-gold) 80%
        );
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shine 5s linear infinite;
      }

      .session-block-premium {
        border: 1px solid var(--border-color);
        background: rgba(255, 255, 255, 0.02);
        animation: borderPulse 5s infinite ease-in-out;
        transition: all 0.6s cubic-bezier(0.2, 1, 0.3, 1);
      }

      .session-block-premium:hover {
        border-color: var(--light-gold);
        /* 호버 시 테마 색상으로 은은한 빛 발산 */
        box-shadow: 0 0 40px var(--glow-color);
        background: rgba(255, 255, 255, 0.04);
        transform: translateY(-5px) scale(1.01);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
          "react/": "https://esm.sh/react@^19.2.3/",
          "react": "https://esm.sh/react@^19.2.3"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
